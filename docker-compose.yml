services:
  postgres:
    image: postgres:16-alpine
    container_name: oferta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oferta
      POSTGRES_USER: oferta
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oferta_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oferta"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oferta_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: oferta_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-dev_master_key}
      MEILI_ENV: ${NODE_ENV:-development}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    command: ["sh", "-c", "node node_modules/prisma/build/index.js migrate deploy && node apps/api/dist/main"]
    container_name: oferta_api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/ready', {signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oferta:${DB_PASSWORD:-oferta_dev}@postgres:5432/oferta
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      API_PORT: 3001
      IMAGE_SERVICE_URL: http://image-service:4001
      TRUSTED_PROXY_CIDRS: 172.29.80.10/32
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ofertasuksesi.com/api/v1}
        NEXT_PUBLIC_IMAGE_URL: ${NEXT_PUBLIC_IMAGE_URL:-https://img.ofertasuksesi.com}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://ofertasuksesi.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://ofertasuksesi.com}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: oferta_web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready', {signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    restart: unless-stopped
    env_file: .env
    environment:
      API_URL: http://api:3001/api/v1
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  image-service:
    build:
      context: .
      target: image-service
    container_name: oferta_image_service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health', {signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    restart: unless-stopped
    env_file: .env
    environment:
      IMAGE_AUTH_API_URL: http://api:3001/api/v1
      IMAGE_SERVICE_PORT: 4001
      PUBLIC_URL: ${NEXT_PUBLIC_IMAGE_URL:-https://img.ofertasuksesi.com}
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - ./apps/image-service/uploads:/app/uploads

  nginx:
    image: nginx:alpine
    networks:
      default:
        ipv4_address: 172.29.80.10
    container_name: oferta_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-cloudflare.conf:/etc/nginx/oferta-cloudflare.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - web
      - api
      - image-service

  notification-service:
    build:
      context: .
      target: notification-service
    container_name: oferta_notification_service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/ready', {signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oferta:${DB_PASSWORD:-oferta_dev}@postgres:5432/oferta
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.80.0/24
