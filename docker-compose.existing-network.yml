# Use with docker-compose.yml for a release sharing an existing proxy/network.
# Requires Compose 2.24.4+ (!override). See docs/DEPLOYMENT.md.
services:
  postgres:
    image: ${OFERTA_POSTGRES_IMAGE:?Set the currently running PostgreSQL image ID}
  redis:
    image: ${OFERTA_REDIS_IMAGE:?Set the currently running Redis image ID}
  meilisearch:
    image: ${OFERTA_SEARCH_IMAGE:?Set the currently running Meilisearch image ID}
  api:
    image: ofertasuksesi-api:${OFERTA_RELEASE_TAG:?Set the release commit}
    environment:
      TRUSTED_PROXY_CIDRS: ${OFERTA_PROXY_IP:?Set the existing Nginx IP}/32
  web:
    image: ofertasuksesi-web:${OFERTA_RELEASE_TAG:?Set the release commit}
  image-service:
    image: ofertasuksesi-image-service:${OFERTA_RELEASE_TAG:?Set the release commit}
    volumes: !override
      - ${OFERTA_LIVE_DIR:?Set the existing repository directory}/apps/image-service/uploads:/app/uploads
  notification-service:
    image: ofertasuksesi-notification-service:${OFERTA_RELEASE_TAG:?Set the release commit}
  nginx:
    image: ${OFERTA_NGINX_IMAGE:?Set the currently running Nginx image ID}
    networks: !override
      default:
        ipv4_address: ${OFERTA_PROXY_IP:?Set the existing Nginx IP}
    # The prepared shared config contains Cloudflare directives inline, scoped
    # to Oferta's TLS servers. It preserves the existing mounted file/inode.
    volumes: !override
      - ${OFERTA_LIVE_DIR:?Set the existing repository directory}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
networks:
  default: !override
    external: true
    name: ${OFERTA_NETWORK_NAME:?Set the existing Docker network name}
